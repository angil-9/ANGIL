<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEM</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08090b;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#intro{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(55,48,55,.35),
            rgba(5,6,8,.98)
        );

    color:white;
}

.intro-box{
    text-align:center;
    max-width:600px;
    padding:40px;
}

.logo{
    font-size:70px;
    letter-spacing:18px;
    margin-bottom:10px;
}

.subtitle{
    opacity:.65;
    line-height:1.8;
    margin-bottom:35px;
}

#start{
    border:none;
    padding:15px 45px;
    border-radius:30px;
    cursor:pointer;

    background:#eee7e5;
    color:#171518;

    font-size:17px;
    transition:.25s;
}

#start:hover{
    transform:scale(1.05);
}

#hud{
    position:fixed;
    top:20px;
    left:20px;

    z-index:20;

    color:white;

    background:rgba(0,0,0,.35);

    padding:12px 16px;

    border-radius:12px;

    backdrop-filter:blur(8px);

    pointer-events:none;
}

#day{
    font-size:15px;
}

#objective{
    margin-top:5px;
    opacity:.65;
    font-size:12px;
}

#interaction{
    position:fixed;
    bottom:45px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    background:rgba(0,0,0,.55);

    padding:12px 22px;

    border-radius:20px;

    opacity:0;

    transition:.3s;

    pointer-events:none;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:translate(-50%,-50%);

    background:white;

    border-radius:50%;

    opacity:.8;

    z-index:30;

    pointer-events:none;
}

#blackout{
    position:fixed;
    inset:0;

    background:#000;

    opacity:0;

    pointer-events:none;

    z-index:80;

    transition:opacity 1s;
}

#blackout.show{
    opacity:1;
}
</style>
</head>


<body>

<div id="intro">

    <div class="intro-box">

        <div class="logo">
            MEM
        </div>

        <div class="subtitle">

            في البداية كان كل شيء طبيعيًا.<br>
            مجرد بيت... ومجرد فتاة اسمها Mem.

        </div>

        <button id="start">
            ابدأ
        </button>

    </div>

</div>


<div id="hud">

    <div id="day">
        اليوم الأول
    </div>

    <div id="objective">
        استكشف البيت
    </div>

</div>


<div id="crosshair"></div>

<div id="interaction">
    اضغط E للتفاعل
</div>

<div id="blackout"></div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x101216);

scene.fog =
new THREE.Fog(
    0x101216,
    8,
    45
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    .05,
    100
);

camera.position.set(
    0,
    1.65,
    8
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.15;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sky =
new THREE.HemisphereLight(
    0xbcc9dc,
    0x241d20,
    1.8
);

scene.add(sky);


const mainLight =
new THREE.DirectionalLight(
    0xffe6ce,
    2.5
);

mainLight.position.set(
    -5,
    8,
    4
);

mainLight.castShadow = true;

mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;

scene.add(mainLight);


/* =====================================================
   MATERIALS
===================================================== */

function mat(
    color,
    roughness=.8
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness
    });

}


/* =====================================================
   CREATE BOX
===================================================== */

function box(
    x,
    y,
    z,
    width,
    height,
    depth,
    color
){

    const object =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),

        mat(color)

    );

    object.position.set(
        x,
        y,
        z
    );

    object.castShadow = true;
    object.receiveShadow = true;

    scene.add(object);

    return object;
}


/* =====================================================
   FLOOR
===================================================== */

box(
    0,
    -.1,
    0,

    28,
    .2,
    28,

    0x6e5b52
);


/* =====================================================
   HOUSE OUTER WALLS
===================================================== */

box(
    0,
    4,
    -13,

    28,
    8,
    .3,

    0xbeb6b1
);

box(
    -14,
    4,
    0,

    .3,
    8,
    26,

    0xbeb6b1
);

box(
    14,
    4,
    0,

    .3,
    8,
    26,

    0xbeb6b1
);


/* =====================================================
   INTERIOR WALLS
===================================================== */

/*
   هذه بداية تقسيم البيت:

   ┌───────────────┐
   │    غرفة       │
   │               │
   ├───────┬───────┤
   │ صالة  │ مطبخ  │
   │       │       │
   └───────┴───────┘
*/


box(
    -5,
    4,
    -3,

    .25,
    8,
    8,

    0xc7beb8
);


box(
    5,
    4,
    -3,

    .25,
    8,
    8,

    0xc7beb8
);


box(
    0,
    4,
    2,

    10,
    8,
    .25,

    0xc7beb8
);


/* =====================================================
   CARPET
===================================================== */

const carpet =
new THREE.Mesh(

    new THREE.BoxGeometry(
        8,
        .08,
        5
    ),

    mat(0x80666b)

);

carpet.position.set(
    0,
    .05,
    6
);

carpet.receiveShadow = true;

scene.add(carpet);


/* =====================================================
   SOFA
===================================================== */

box(
    -6,
    1.3,
    7,

    5,
    1.4,
    2,

    0x4c5157
);

box(
    -6,
    2.5,
    6.2,

    5,
    2,
    .5,

    0x4c5157
);


/* =====================================================
   COFFEE TABLE
===================================================== */

box(
    0,
    .8,
    7,

    3,
    .25,
    1.7,

    0x563e34
);

box(
    -1.1,
    .4,
    7,

    .18,
    .8,
    .18,

    0x3d2b25
);

box(
    1.1,
    .4,
    7,

    .18,
    .8,
    .18,

    0x3d2b25
);


/* =====================================================
   WINDOW
===================================================== */

const glass =
new THREE.Mesh(

    new THREE.BoxGeometry(
        5,
        3.5,
        .1
    ),

    new THREE.MeshPhysicalMaterial({

        color:0x6e8992,

        roughness:.15,

        transparent:true,

        opacity:.65

    })

);

glass.position.set(
    0,
    4.2,
    -12.75
);

scene.add(glass);


/* =====================================================
   WINDOW FRAME
===================================================== */

box(
    -2.5,
    4.2,
    -12.55,

    .18,
    3.8,
    .2,

    0xe5dfda
);

box(
    2.5,
    4.2,
    -12.55,

    .18,
    3.8,
    .2,

    0xe5dfda
);

box(
    0,
    6,
    -12.55,

    5,
    .18,
    .2,

    0xe5dfda
);

box(
    0,
    2.4,
    -12.55,

    5,
    .18,
    .2,

    0xe5dfda
);


/* =====================================================
   MEM
===================================================== */

/*

   هنا مكان موديل Mem الحقيقي.

   لما نجهز ملف:

   mem.glb

   نحطه بجانب index.html
   ثم نفعّل الكود الموجود تحت.

*/


let mem = null;


/* =====================================================
   LOAD REAL MEM MODEL
===================================================== */

const loader =
new GLTFLoader();


function loadMem(){

    loader.load(

        "mem.glb",

        function(gltf){

            mem =
            gltf.scene;

            mem.scale.set(
                1,
                1,
                1
            );

            mem.position.set(
                0,
                0,
                -7
            );

            mem.traverse(
                object => {

                    if(
                        object.isMesh
                    ){

                        object.castShadow =
                        true;

                        object.receiveShadow =
                        true;

                    }

                }
            );

            scene.add(mem);

        },

        undefined,

        function(){

            console.log(
                "Mem model not found yet."
            );

        }

    );

}


/*
   حالياً لا نشغلها لأن
   ملف mem.glb لم نصنعه بعد.

   loadMem();
*/


/* =====================================================
   PLAYER
===================================================== */

const player = {

    speed:4,

    height:1.65,

    yaw:0,

    pitch:0

};


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};

document.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;

    }
);

document.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   MOUSE
===================================================== */

let mouseLocked = false;


renderer.domElement.addEventListener(
    "click",
    () => {

        if(
            document.pointerLockElement !==
            renderer.domElement
        ){

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
        document.pointerLockElement ===
        renderer.domElement;

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if(!mouseLocked)
            return;

        player.yaw -=
            event.movementX *
            .002;

        player.pitch -=
            event.movementY *
            .002;

        player.pitch =
            Math.max(
                -1.35,
                Math.min(
                    1.35,
                    player.pitch
                )
            );

    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(
    delta
){

    let forward = 0;
    let sideways = 0;

    if(keys["w"])
        forward += 1;

    if(keys["s"])
        forward -= 1;

    if(keys["a"])
        sideways -= 1;

    if(keys["d"])
        sideways += 1;


    const direction =
    new THREE.Vector3(
        Math.sin(player.yaw),
        0,
        Math.cos(player.yaw)
    );


    const side =
    new THREE.Vector3(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
    );


    camera.position.addScaledVector(
        direction,
        -forward *
        player.speed *
        delta
    );


    camera.position.addScaledVector(
        side,
        sideways *
        player.speed *
        delta
    );


    /*
       حدود البيت
    */

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -12.5,
            12.5
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -11.5,
            11.5
        );


    camera.position.y =
        player.height;


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;

}


/* =====================================================
   START
===================================================== */

document
.getElementById("start")
.addEventListener(
    "click",
    () => {

        document
        .getElementById("intro")
        .style.display =
        "none";

        renderer
        .domElement
        .requestPointerLock();

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        clock.getDelta();


    updatePlayer(
        delta
    );


    /*
       حركة خفيفة للكاميرا
       أثناء المشي
    */

    const moving =
        keys["w"] ||
        keys["s"] ||
        keys["a"] ||
        keys["d"];


    if(
        moving &&
        mouseLocked
    ){

        camera.position.y =
            player.height +
            Math.sin(
                performance.now() *
                .009
            ) * .025;

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
