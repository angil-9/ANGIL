<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEM</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;font-family:Arial,Tahoma,sans-serif}
#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#302b31,#07080a 75%);color:#fff}.box{text-align:center;padding:40px}h1{font-size:72px;letter-spacing:18px;margin:0 0 12px}p{opacity:.7;line-height:1.8;margin-bottom:28px}button{border:0;border-radius:30px;padding:16px 48px;font-size:18px;cursor:pointer;background:#eee7e5;color:#171518}button:active{transform:scale(.96)}
#hud{position:fixed;top:18px;left:18px;z-index:10;color:white;background:#0006;padding:12px 16px;border-radius:12px;display:none}#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;background:white;border-radius:50%;transform:translate(-50%,-50%);display:none;z-index:20}#status{position:fixed;left:50%;bottom:35px;transform:translateX(-50%);z-index:60;color:#fff;background:#000b;padding:12px 20px;border-radius:12px;display:none;text-align:center}
</style></head><body>
<div id="intro"><div class="box"><h1>MEM</h1><p>في البداية كان كل شيء طبيعيًا.<br>مجرد بيت... ومجرد فتاة اسمها Mem.</p><button id="start">ابدأ اللعبة</button></div></div>
<div id="hud">W A S D للحركة — الماوس للنظر</div><div id="cross"></div><div id="status"></div>
<script>
const intro=document.getElementById("intro"),start=document.getElementById("start"),statusBox=document.getElementById("status");
function status(t){statusBox.textContent=t;statusBox.style.display="block"}
start.onclick=async()=>{start.disabled=true;start.textContent="جاري التشغيل...";intro.style.display="none";document.getElementById("hud").style.display="block";document.getElementById("cross").style.display="block";try{await loadThree();build()}catch(e){console.error(e);status("الواجهة اشتغلت، لكن محرك 3D لم يتحمل. تأكدي من الإنترنت ثم أعيدي فتح الملف.")}};
function loadThree(){return new Promise((ok,no)=>{if(window.THREE)return ok();let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
let scene,camera,renderer,yaw=0,pitch=0,locked=false;const keys={};
function build(){
scene=new THREE.Scene();scene.background=new THREE.Color(0x111216);scene.fog=new THREE.Fog(0x111216,8,45);
camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);camera.position.set(0,1.65,8);
renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9e5ff,0x30252a,2));let l=new THREE.DirectionalLight(0xffdfc2,2.5);l.position.set(-5,8,5);l.castShadow=true;scene.add(l);
add(0,-.1,0,28,.2,28,0x6e5b52);add(0,4,-13,28,8,.3,0xc7beb8);add(-14,4,0,.3,8,26,0xc7beb8);add(14,4,0,.3,8,26,0xc7beb8);add(-5,4,-3,.25,8,8,0xc7beb8);add(5,4,-3,.25,8,8,0xc7beb8);add(0,4,2,10,8,.25,0xc7beb8);add(-6,1.3,7,5,1.4,2,0x4c5157);add(-6,2.5,6.2,5,2,.5,0x4c5157);add(0,.8,7,3,.25,1.7,0x563e34);
renderer.domElement.onclick=()=>{if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock().catch(()=>{})};
document.onpointerlockchange=()=>locked=document.pointerLockElement===renderer.domElement;
document.onmousemove=e=>{if(!locked)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.3,Math.min(1.3,pitch))};requestAnimationFrame(loop)}
function add(x,y,z,w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
document.onkeydown=e=>keys[e.key.toLowerCase()]=true;document.onkeyup=e=>keys[e.key.toLowerCase()]=false;
let last=performance.now();function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;let f=(keys.w?1:0)-(keys.s?1:0),s=(keys.d?1:0)-(keys.a?1:0);let d=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),q=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(d,-f*4*dt);camera.position.addScaledVector(q,s*4*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-12.5,12.5);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-11.5,11.5);camera.position.y=1.65;camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}
addEventListener("resize",()=>{if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
